
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHHAVI AI STUDIO</title>
  <style>
    body {
      background: #000; color: #fff; height: 100vh; margin: 0;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      font-family: Arial, sans-serif; text-align: center;
    }
    h1 { font-size: 48px; font-weight: bold; margin: 0; }
    p { font-size: 18px; margin-bottom: 30px; }
    button {
      background: #4285F4; color: white; border: none; padding: 12px 24px;
      border-radius: 8px; font-size: 16px; cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>CHHAVI AI STUDIO</h1>
  <p>Transform the World with AI</p>
  <button id="googleBtn">Sign in with Google</button>
  <p id="userInfo"></p>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBVXGFAgA_3I9iaaThlOR6yxeaT5Jf2eko",
      authDomain: "chhavi-ai-studio-880e0.firebaseapp.com",
      databaseURL: "https://chhavi-ai-studio-880e0-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "chhavi-ai-studio-880e0",
      storageBucket: "chhavi-ai-studio-880e0.firebasestorage.app",
      messagingSenderId: "222585971976",
      appId: "1:222585971976:web:1290feb7a09e49c4ae38bd",
      measurementId: "G-CYPZSEHQK4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    document.getElementById("googleBtn").addEventListener("click", async () => {
      try {
        const result = await signInWithPopup(auth, provider);
        document.getElementById("userInfo").innerText = "Welcome " + result.user.displayName;
      } catch (error) {
        alert("Error: " + error.message);
      }
    });
  </script>
</body>
</html>
