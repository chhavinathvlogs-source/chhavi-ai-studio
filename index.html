<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBVGXFAgA_3l9IaaATnLQR6yx",
    authDomain: "chhavi-ai-studio-880e0.firebaseapp.com",
    projectId: "chhavi-ai-studio-880e0",
    storageBucket: "chhavi-ai-studio-880e0.firebasestorage.app",
    messagingSenderId: "222585971976",
    appId: "1:222585971976:web:1290feb7a09e49c4ae38bd",
    measurementId: "G-CYPZSEHQK4"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  document.getElementById("loginBtn").addEventListener("click", () => {
    const provider = new GoogleAuthProvider();
    signInWithPopup(auth, provider)
      .then((result) => {
        const user = result.user;
        set(ref(db, 'users/' + user.uid), {
          name: user.displayName,
          email: user.email
        });
        alert("Login हो गया और डेटा Save हो गया!");
      })
      .catch((error) => {
        alert("Error: " + error.message);
      });
  });
</script>
