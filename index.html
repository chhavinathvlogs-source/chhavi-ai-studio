
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>Chhavi AI Studio - Login + Database</title>
  <style>
    body{font-family:Arial;background:#f0f2f5;display:flex;justify-content:center;align-items:center;height:100vh}
    .box{background:white;padding:30px;border-radius:10px;box-shadow:0 0 10px #ccc;width:350px;text-align:center}
    input{width:90%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:5px}
    button{width:95%;padding:10px;background:#1877f2;color:white;border:none;border-radius:5px;cursor:pointer;margin-top:10px}
    #googleBtn{background:#db4437}
    #logoutBtn{background:#555;display:none}
    #appBox{display:none}
  </style>
</head>
<body>

<div class="box" id="loginBox">
  <h2>Login / Sign Up</h2>
  <input type="email" id="email" placeholder="Email डालो">
  <input type="password" id="password" placeholder="Password डालो">
  <button onclick="signup()">Sign Up</button>
  <button onclick="login()">Login</button>
  <hr>
  <button id="googleBtn" onclick="googleLogin()">Google से Login करो</button>
</div>

<div class="box" id="appBox">
  <h2>Welcome <span id="userEmail"></span></h2>
  <input type="text" id="dataInput" placeholder="यहां कुछ लिखो">
  <button onclick="saveData()">Data Save करो</button>
  <button id="logoutBtn" onclick="logout()">Logout</button>
  <p id="status"></p>
</div>

<script type="module">
  // तुम्हारी Firebase Config
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
  import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDFG_AgL319aaoTN8RyamqS7cZekQ",
    authDomain: "chhavi-ai-studio-88086.firebaseapp.com",
    projectId: "chhavi-ai-studio-88086",
    storageBucket: "chhavi-ai-studio-88086.appspot.com",
    messagingSenderId: "1222588971979",
    appId: "1:1222588971979:web:129e97abfa9e94d3aa88bd",
    measurementId: "G-CP92EJQKX4"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth();
  const db = getDatabase();
  const provider = new GoogleAuthProvider();

  // Login State Check
  onAuthStateChanged(auth, (user) => {
    if (user) {
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('appBox').style.display = 'block';
      document.getElementById('userEmail').innerText = user.email;
    } else {
      document.getElementById('loginBox').style.display = 'block';
      document.getElementById('appBox').style.display = 'none';
    }
  });

  // Functions
  window.signup = () => {
    const email = document.getElementById('email').value;
    const pass = document.getElementById('password').value;
    createUserWithEmailAndPassword(auth, email, pass)
    .then(() => alert("Account बन गया!"))
    .catch(e => alert(e.message));
  }

  window.login = () => {
    const email = document.getElementById('email').value;
    const pass = document.getElementById('password').value;
    signInWithEmailAndPassword(auth, email, pass)
    .catch(e => alert(e.message));
  }

  window.googleLogin = () => {
    signInWithPopup(auth, provider).catch(e => alert(e.message));
  }

  window.logout = () => {
    signOut(auth);
  }

  window.saveData = () => {
    const data = document.getElementById('dataInput').value;
    const user = auth.currentUser;
    if(user){
      set(ref(db, 'users/' + user.uid), {
        data: data
      });
      document.getElementById('status').innerText = "Data Save हो गया Firebase में!";
    }
  }
</script>
</body>
  </html>
